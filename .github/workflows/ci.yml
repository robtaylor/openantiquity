# Pushes to main and pull requests: both check suites, the end-to-end tests on
# the real backend, the docs lint, and the deployment code. Third-party actions are pinned by commit; the comment
# beside each says which release that commit is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The same PostGIS build as infra/docker-compose.yml, on the same port,
      # so the test fixtures' default server address works unchanged. Pinned
      # by digest so a re-pushed tag can't change the database under the tests;
      # `docker buildx imagetools inspect imresamu/postgis:17-3.5` gives a new one.
      db:
        image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
        env:
          POSTGRES_USER: fieldclub
          POSTGRES_PASSWORD: fieldclub
          POSTGRES_DB: fieldclub
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fieldclub -d fieldclub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    # A slow runner takes about 20 minutes. The cap leaves room for the slowest end-to-end
    # test to run out its eight minutes twice, so its trace is still uploaded when it hangs.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.16.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Fixture mode: no backend and no network, as the e2e specs require.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  full:
    name: End to end on the real backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The backend job's database, pinned the same way. playwright.full.config.ts
      # makes a database of its own on this server and drops it at the end.
      db:
        image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
        env:
          POSTGRES_USER: fieldclub
          POSTGRES_PASSWORD: fieldclub
          POSTGRES_DB: fieldclub
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fieldclub -d fieldclub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.16.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Builds the interface, starts the backend to serve it as production
      # does, and reaches nothing outside the runner.
      - run: pnpm e2e:full
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-full-results
          # The traces, and the build's and the backend's output from the temporary directory.
          path: |
            frontend/test-results
            /tmp/fieldclub-e2e-*.log
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv run docs/scripts/doctool.py lint

  infra:
    name: Deployment code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false
      # The Google Cloud deployment, kept until the cut-over to Fly.io
      # (infra/README.md). It is also how the Google project is taken down.
      - name: Terraform format, validate and offline tests
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      # shellcheck comes with the runner image.
      - name: Shell scripts
        run: shellcheck infra/*.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds the image Fly would run, without pushing it anywhere.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fieldclub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs it as a Fly machine would, so a missing library or a bad entrypoint
      # fails here: it must answer /healthz and serve the app at /, then stop
      # well inside the ten seconds fly.toml's kill_timeout allows after SIGTERM.
      - name: Start the image and check it answers
        run: |
          # No database here, so the schema is left alone, as it is in production.
          docker run --detach --name fieldclub --publish 8080:8080 --env PORT=8080 \
            --env FIELDCLUB_AUTO_CREATE_SCHEMA=false fieldclub:ci
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
          started=$(date +%s)
          docker stop --time 10 fieldclub
          stopped_in=$(( $(date +%s) - started ))
          echo "Stopped in ${stopped_in} s"
          [ "$stopped_in" -lt 8 ]
      - if: always()
        run: docker logs fieldclub || true
