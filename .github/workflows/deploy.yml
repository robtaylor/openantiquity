# Run by hand from main: build the image, push it to the project's registry,
# and print what `terraform apply` would change to run it. It deploys nothing.
# The owner reads the plan and applies it (infra/README.md, "A deploy").
#
# It reaches Google Cloud through workload identity federation, so there is no
# key anywhere. Set these repository variables (Settings, Secrets and
# variables, Actions, Variables) from `terraform output`:
#
#   GCP_PROJECT_ID                  the project id
#   GCP_WORKLOAD_IDENTITY_PROVIDER  output workload_identity_provider
#   GCP_DEPLOYER_SERVICE_ACCOUNT    output deployer_service_account
#   TFVARS                          the contents of terraform.tfvars, which hold no secret
name: Build and plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: europe-west2
  PROJECT: ${{ vars.GCP_PROJECT_ID }}

jobs:
  build-and-plan:
    name: Build, push and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The identity pool only trusts main, so refuse anything else up front.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the repository variables
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          TFVARS: ${{ vars.TFVARS }}
        run: |
          for name in PROJECT PROVIDER ACCOUNT TFVARS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable for $name is not set"
              exit 1
            fi
          done

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cloud Run runs linux/amd64 only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/fieldclub/fieldclub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TFVARS: ${{ vars.TFVARS }}
        run: |
          printf '%s\n' "$TFVARS" > terraform.tfvars
          terraform init -input=false -backend-config="bucket=${PROJECT}-tfstate"
          terraform plan -input=false -lock-timeout=5m -var "image_tag=${GITHUB_SHA}" -out=tfplan
          {
            echo "## Terraform plan for ${GITHUB_SHA}"
            echo
            echo '```'
            terraform show -no-color tfplan | tail -n 200
            echo '```'
            echo
            echo "To deploy, from infra/terraform: terraform apply -var image_tag=${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
