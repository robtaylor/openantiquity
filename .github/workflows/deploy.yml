# Run by hand from main: deploy the web app to Fly.io. `flyctl deploy` builds
# the image on Fly's builder from infra/Dockerfile, pushes it labelled with the
# commit, runs fly.toml's release_command (the schema, once) and rolls the
# machines onto it one at a time (infra/README.md, "A deploy").
#
# It holds one secret, FLY_API_TOKEN: a deploy token for the app openantiquity
# alone, kept in the repository's `production` environment, which only main
# may use. Make it with
#
#   fly tokens create deploy --app openantiquity --name github-deploy --expiry 2160h |
#     gh secret set FLY_API_TOKEN --env production
#
# The jobs app, which holds Defra's login, is never reachable from here. After
# a deploy, the owner moves its hourly machine to the new image with the
# command the run's summary prints.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment only allows main as well; refuse anything else up front.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: "0.5.8"

      - name: Check the deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set in the production environment"
            exit 1
          fi

      # fly.toml at the repository root names the app, the Dockerfile and the release command.
      - name: Build, push and deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --image-label "$GITHUB_SHA" --wait-timeout 10m

      - name: Say what to run next
        run: |
          {
            echo "## Deployed ${GITHUB_SHA}"
            echo
            echo "Image: registry.fly.io/openantiquity:${GITHUB_SHA}"
            echo
            echo "Move the jobs app's hourly machine to it, from the main checkout:"
            echo
            echo '```'
            echo "uv run infra/fly_jobs.py --commit ${GITHUB_SHA} schedule"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
