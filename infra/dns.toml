# The DNS record sets this project manages at Gandi, applied by infra/dns.py.
#
# Only what is listed here is read or written. Everything else in a zone is
# left as it is, including the mail records Gandi made when the domains were
# registered. A record set is one name and type with all its values. Give
# values the way Gandi shows them (`uv run infra/dns.py show`), with host names
# ending in a dot. `absent = true` removes a record set if it exists.
#
# openantiquity.org is the site's address. The .com and .co.uk are held so
# nobody else has them, and will redirect to it.

# Which certificate authorities may issue for these names. Fly.io issues its
# certificates from Let's Encrypt. Google's load balancer, which was never
# turned on, would have used Google Trust Services or Let's Encrypt; drop
# "pki.goog" when the Google project is taken down. Nobody else has a reason
# to issue one.
[[record]]
domains = ["openantiquity.org", "openantiquity.com", "openantiquity.co.uk"]
name = "@"
type = "CAA"
ttl = 3600
values = ['0 issue "pki.goog"', '0 issue "letsencrypt.org"']

# --- Pointing the names at Fly.io (infra/README.md, "The domain") -----------
# The web app's addresses, from `fly ips list -a openantiquity`: the shared
# IPv4 address and the app's own IPv6 address. An apex name can't be a CNAME,
# so each domain's @ gets the A and AAAA records, and each www a CNAME to the
# app's own name. The AAAA record also lets Fly check the domain is ours
# before it issues a certificate. The .com, the .co.uk and every www are
# answered with a redirect to openantiquity.org by the application
# (FIELDCLUB_REDIRECT_HOSTS in fly.toml).

[[record]]
domains = ["openantiquity.org", "openantiquity.com", "openantiquity.co.uk"]
name = "@"
type = "A"
ttl = 3600
values = ["66.241.124.216"]

[[record]]
domains = ["openantiquity.org", "openantiquity.com", "openantiquity.co.uk"]
name = "@"
type = "AAAA"
ttl = 3600
values = ["2a09:8280:1::1fe:8e38:0"]

[[record]]
domains = ["openantiquity.org", "openantiquity.com", "openantiquity.co.uk"]
name = "www"
type = "CNAME"
ttl = 3600
values = ["openantiquity.fly.dev."]
